version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross
  # Stable Developer ID identity so TCC (Accessibility) grants survive rebuilds (D-10).
  SIGN_IDENTITY: "Developer ID Application: Ken Scott (S2K7P43927)"
  INSTALL_PATH:
    sh: echo "$HOME/Applications/Gifsmith.app"
  # Release (D-13, D-14). Keep VERSION equal to Info.plist and services.Version
  # (internal/services/version_test.go checks both, and DMG_NAME against the updater).
  VERSION: "1.0.1"
  NOTARY_PROFILE: "gifsmith-notary"
  RELEASE_DIR: "{{.BIN_DIR}}/release"
  DMG_NAME: "Gifsmith-{{.VERSION}}-arm64.dmg"

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle

  package:dmg:
    summary: Packages the application into a styled `.dmg`
    deps:
      - task: package
    cmds:
      - task: create:dmg

  create:dmg:
    summary: Creates a configurable `.dmg` from the `.app` bundle
    platforms: [darwin]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.APP_NAME}}" --out "{{.BIN_DIR}}"
        --background "{{.DMG_BACKGROUND}}"
        --volume-icon "{{.DMG_VOLUME_ICON}}"
        --file-icon "{{.DMG_FILE_ICON}}"
        --window-width "{{.DMG_WINDOW_WIDTH}}"
        --window-height "{{.DMG_WINDOW_HEIGHT}}"
        {{if .DMG_FILES}}--files "{{.DMG_FILES}}"{{end}}
    vars:
      DMG_BACKGROUND: '{{.DMG_BACKGROUND | default "build/darwin/dmg-background.png"}}'
      DMG_VOLUME_ICON: '{{.DMG_VOLUME_ICON | default "build/darwin/icons.icns"}}'
      DMG_FILE_ICON: '{{.DMG_FILE_ICON | default "build/darwin/dmg-file-icon.icns"}}'
      DMG_WINDOW_WIDTH: '{{.DMG_WINDOW_WIDTH | default "540"}}'
      DMG_WINDOW_HEIGHT: '{{.DMG_WINDOW_HEIGHT | default "380"}}'
      DMG_FILES: '{{.DMG_FILES | default ""}}'


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      # A reused bundle can acquire Finder metadata in synced folders. Build a
      # fresh bundle so codesign never has to replace a contaminated signature.
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - cp LICENSE "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/LICENSE"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  install:dev:
    summary: Build, Developer ID-sign (hardened runtime) and install to ~/Applications/Gifsmith.app
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" --identity "{{.SIGN_IDENTITY}}" --hardened-runtime
      - pkill -x {{.APP_NAME}} || true
      # SIGTERM returns at once; replacing the bundle while the old instance runs lets `open` reuse it.
      - |
        for i in $(seq 1 50); do
          pgrep -x {{.APP_NAME}} >/dev/null || exit 0
          sleep 0.1
        done
        echo "{{.APP_NAME}} did not exit within 5s"
        exit 1
      - case "{{.INSTALL_PATH}}" in */Applications/Gifsmith.app) ;; *) echo "refusing to install to '{{.INSTALL_PATH}}'"; exit 1;; esac
      - rm -rf "{{.INSTALL_PATH}}"
      - ditto "{{.BIN_DIR}}/{{.APP_NAME}}.app" "{{.INSTALL_PATH}}"
      - ': > "{{.ROOT_DIR}}/{{.BIN_DIR}}/install-dev.log"'
      - open --stderr "{{.ROOT_DIR}}/{{.BIN_DIR}}/install-dev.log" "{{.INSTALL_PATH}}"

  release:build:
    summary: Developer ID-signed arm64 Gifsmith.app and DMG in bin/release, verified (no notarization)
    cmds:
      - task: release:app
      - task: release:assemble
        vars:
          NOTARIZE: "false"

  release:
    summary: Signed, notarized and stapled arm64 Gifsmith.app and DMG in bin/release, verified
    preconditions:
      - sh: xcrun notarytool history --keychain-profile "{{.NOTARY_PROFILE}}" >/dev/null 2>&1
        msg: 'No working notary profile "gifsmith-notary": resolve the Apple Developer agreement and run notarytool store-credentials (see .planning/phases/04-settings-shell-polish-release/04-KLIPY-EMAIL.md)'
    cmds:
      - task: release:app
      - task: release:sign

  # CI runs release:app in a job with no credentials and release:sign in a separate job on a
  # fresh runner that only downloads the built bundle, so no dependency install or frontend/Go
  # build runs on the runner where the Developer ID identity is unlocked. Locally both run in one
  # shell under your own account; that is your machine's trust boundary, not this file's.
  release:app:
    summary: Builds the unsigned arm64 bin/gifsmith.app that release:sign signs (installs dependencies)
    preconditions:
      # shortcut: untracked files are not checked; check them too if a release ever ships one.
      - sh: git diff --quiet HEAD --
        msg: "Tracked files differ from HEAD: commit or stash them before a release build"
    cmds:
      - task: package
        vars:
          ARCH: arm64
      - bash scripts/release-stamp.sh write "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  release:sign:
    summary: Signs, notarizes, staples and verifies the bin/gifsmith.app that release:app built at HEAD
    preconditions:
      - sh: test -x "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
        msg: "No {{.BIN_DIR}}/{{.APP_NAME}}.app: run release:app first"
      - sh: bash scripts/release-stamp.sh check "{{.BIN_DIR}}/{{.APP_NAME}}.app"
        msg: "{{.BIN_DIR}}/{{.APP_NAME}}.app is not the release:app build of HEAD (or changed since): run release:app"
      - sh: xcrun notarytool history --keychain-profile "{{.NOTARY_PROFILE}}" >/dev/null 2>&1
        msg: 'No working notary profile "gifsmith-notary": resolve the Apple Developer agreement and run notarytool store-credentials (see .planning/phases/04-settings-shell-polish-release/04-KLIPY-EMAIL.md)'
    cmds:
      - task: release:assemble
        vars:
          NOTARIZE: "true"

  release:assemble:
    summary: Shared release steps on bin/gifsmith.app; NOTARIZE=true adds notarize + staple for the app and the DMG
    internal: true
    cmds:
      - case "{{.RELEASE_DIR}}" in */release) ;; *) echo "refusing to use release dir '{{.RELEASE_DIR}}'"; exit 1;; esac
      - rm -rf "{{.RELEASE_DIR}}"
      - mkdir -p "{{.RELEASE_DIR}}"
      # Finder shows the bundle name; APP_NAME is lowercase.
      - ditto "{{.BIN_DIR}}/{{.APP_NAME}}.app" "{{.RELEASE_DIR}}/Gifsmith.app"
      - wails3 tool sign --input "{{.RELEASE_DIR}}/Gifsmith.app" --identity "{{.SIGN_IDENTITY}}" --hardened-runtime
      # Not wails3's --notarize: scripts/notarize.sh checks the status and retries the staple.
      - '{{if eq .NOTARIZE "true"}}ditto -c -k --keepParent "{{.RELEASE_DIR}}/Gifsmith.app" "{{.RELEASE_DIR}}/Gifsmith.app.zip"{{else}}true{{end}}'
      - '{{if eq .NOTARIZE "true"}}bash scripts/notarize.sh "{{.NOTARY_PROFILE}}" "{{.RELEASE_DIR}}/Gifsmith.app.zip" "{{.RELEASE_DIR}}/Gifsmith.app"{{else}}true{{end}}'
      - rm -f "{{.RELEASE_DIR}}/Gifsmith.app.zip"
      # Two-representation TIFF so the background is sharp on Retina displays.
      - tiffutil -cathidpicheck build/darwin/dmg-background.png build/darwin/dmg-background@2x.png -out "{{.BIN_DIR}}/dmg-background.tiff"
      - >-
        wails3 tool package --format dmg --name Gifsmith --out "{{.RELEASE_DIR}}"
        --background "{{.BIN_DIR}}/dmg-background.tiff"
        --volume-icon build/darwin/icons.icns
        --file-icon build/darwin/dmg-file-icon.icns
        --window-width 540 --window-height 380
        --files "LICENSE=LICENSE"
      - mv "{{.RELEASE_DIR}}/Gifsmith.dmg" "{{.RELEASE_DIR}}/{{.DMG_NAME}}"
      - codesign --force --sign "{{.SIGN_IDENTITY}}" --timestamp "{{.RELEASE_DIR}}/{{.DMG_NAME}}"
      - '{{if eq .NOTARIZE "true"}}bash scripts/notarize.sh "{{.NOTARY_PROFILE}}" "{{.RELEASE_DIR}}/{{.DMG_NAME}}" "{{.RELEASE_DIR}}/{{.DMG_NAME}}"{{else}}true{{end}}'
      - cd "{{.RELEASE_DIR}}" && shasum -a 256 "{{.DMG_NAME}}" > "{{.DMG_NAME}}.sha256"
      - bash scripts/verify-release.sh {{if eq .NOTARIZE "true"}}--notarized {{end}}"{{.RELEASE_DIR}}"

  sign:
    summary: Signs the application bundle with Developer ID
    desc: |
      Signs the .app bundle for distribution.
      Uses signing identity from `wails3 setup` (stored in ~/.config/wails/defaults.yaml).
      Override with: task darwin:sign -- --identity "Developer ID Application: ..."
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" {{.CLI_ARGS}}

  sign:notarize:
    summary: Signs and notarizes the application bundle
    desc: |
      Signs the .app bundle and submits it for notarization.
      Uses signing identity and keychain profile from `wails3 setup`.

      First-time setup:
        wails3 setup
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" --notarize {{.CLI_ARGS}}
